name: smart_keyboard_insets
description: Accurate keyboard height and safe-area insets for Flutter, native on Android & iOS. Size emoji and sticker panels to the keyboard and keep chat composers above it.
version: 0.3.1
homepage: https://github.com/rishi115/smart_keyboard_insets
repository: https://github.com/rishi115/smart_keyboard_insets
issue_tracker: https://github.com/rishi115/smart_keyboard_insets/issues

topics:
  - keyboard
  - insets
  - safe-area
  - chat
  - ui

screenshots:
  - description: Chat composer following the keyboard, then swapping to a sticker panel of the same height.
    path: doc/demo.gif

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.rishi115.smart_keyboard_insets
        pluginClass: SmartKeyboardInsetsPlugin
      ios:
        pluginClass: SmartKeyboardInsetsPlugin
      web:
        pluginClass: SmartKeyboardInsetsWebPlugin
        fileName: src/web_plugin.dart
      macos:
        dartPluginClass: SmartKeyboardInsetsFallbackPlugin
      windows:
        dartPluginClass: SmartKeyboardInsetsFallbackPlugin
      linux:
        dartPluginClass: SmartKeyboardInsetsFallbackPlugin
